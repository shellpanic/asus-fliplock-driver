[package]
name = "asus-numberpad"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-only"
description = "Optional numbers-only ASUS NumberPad session driver"

[features]
test-fixtures = []

[dependencies]
anyhow = "=1.0.102"
clap = { version = "4.5", features = ["derive"] }
futures-lite = "=2.6.1"
libc = "=0.2.186"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.10.9"
signal-hook = "=0.3.18"
zbus = "=5.18.0"

[dev-dependencies]
tempfile = "3.23.0"

[[test]]
name="control"
path="tests-rust/control.rs"

[profile.release]
lto="thin"
codegen-units=1
strip=true
